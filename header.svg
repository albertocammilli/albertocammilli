<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Alberto — Python, rooting, retro hardware">

  <title>Alberto — Python &amp; second-boot hardware</title>

  <defs>
    <!-- ================= MATERIALS ================= -->
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#20252b"/>
      <stop offset="1"   stop-color="#12151a"/>
    </linearGradient>

    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#454b53"/>
      <stop offset="0.35" stop-color="#2c3138"/>
      <stop offset="1"    stop-color="#1a1d22"/>
    </linearGradient>

    <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#c3cbd4"/>
      <stop offset="0.5" stop-color="#7d858f"/>
      <stop offset="1"   stop-color="#41474f"/>
    </linearGradient>

    <linearGradient id="lcdGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#c2dd82"/>
      <stop offset="0.55" stop-color="#a4c463"/>
      <stop offset="1"   stop-color="#87a94b"/>
    </linearGradient>

    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#5a616a"/>
      <stop offset="0.5" stop-color="#3a4048"/>
      <stop offset="1"   stop-color="#23272d"/>
    </linearGradient>

    <linearGradient id="wiiShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e9eef2"/>
      <stop offset="1"    stop-color="#bcc6ce"/>
    </linearGradient>

    <radialGradient id="ledRed" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0"   stop-color="#fff0ee"/>
      <stop offset="0.4" stop-color="#ff4b3e"/>
      <stop offset="1"   stop-color="#6d0e07"/>
    </radialGradient>

    <linearGradient id="slotGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#4fc3f7" stop-opacity="0.1"/>
      <stop offset="0.5"  stop-color="#7fdcff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#4fc3f7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ================= FILTERS ================= -->
    <filter id="inset" x="-25%" y="-25%" width="150%" height="150%">
      <feOffset in="SourceAlpha" dx="0" dy="3" result="o"/>
      <feGaussianBlur in="o" stdDeviation="3.5" result="b"/>
      <feComposite in="SourceAlpha" in2="b" operator="out" result="r"/>
      <feFlood flood-color="#000000" flood-opacity="0.85" result="c"/>
      <feComposite in="c" in2="r" operator="in" result="s"/>
      <feComposite in="s" in2="SourceGraphic" operator="over"/>
    </filter>

    <filter id="drop" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <filter id="glowBlue" x="-120%" y="-400%" width="340%" height="900%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ================= PATTERNS / CLIPS ================= -->
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#8fa3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="matClip">
      <rect x="6" y="6" width="988" height="288" rx="14"/>
    </clipPath>

    <clipPath id="lcdClip">
      <rect x="66" y="66" width="148" height="104" rx="3"/>
    </clipPath>

    <clipPath id="typeClip">
      <rect x="302" y="192" width="0" height="34">
        <animate attributeName="width" values="0;0;300;300;0"
                 keyTimes="0;0.06;0.5;0.93;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- ================= ANTISTATIC BENCH MAT ================= -->
  <rect x="6" y="6" width="988" height="288" rx="14" fill="url(#mat)"/>
  <rect x="6" y="6" width="988" height="288" rx="14" fill="url(#grid)"/>
  <rect x="7.5" y="7.5" width="985" height="285" rx="13" fill="none" stroke="#6f7d8c" stroke-opacity="0.35"/>

  <!-- ================= OLD PHONE (front) ================= -->
  <g filter="url(#drop)">
    <rect x="40" y="30" width="200" height="242" rx="24" fill="url(#shell)"/>
    <rect x="40" y="30" width="200" height="242" rx="24" fill="none" stroke="#79828d" stroke-opacity="0.5" stroke-width="1.3"/>
    <rect x="44" y="34" width="192" height="234" rx="21" fill="none" stroke="#000000" stroke-opacity="0.45"/>
  </g>

  <!-- scuffs on the shell: this thing has lived -->
  <g stroke="#aab4bf" stroke-opacity="0.16" stroke-linecap="round">
    <line x1="52" y1="250" x2="86" y2="258" stroke-width="1.4"/>
    <line x1="196" y1="52" x2="222" y2="44" stroke-width="1"/>
    <line x1="58" y1="66" x2="70" y2="60" stroke-width="1"/>
  </g>

  <!-- earpiece grille -->
  <rect x="112" y="44" width="56" height="7" rx="3.5" fill="#0d0f12"/>
  <rect x="112" y="44" width="56" height="3" rx="1.5" fill="#000000" opacity="0.6"/>

  <!-- notification LED -->
  <g transform="translate(62,48)">
    <circle r="5.5" fill="#0d0f12"/>
    <circle r="3.6" fill="url(#ledRed)">
      <animate attributeName="opacity" values="0.15;1;0.15;0.15;0.15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" fill="#ff4b3e" opacity="0.2" filter="url(#glowSoft)">
      <animate attributeName="opacity" values="0.02;0.3;0.02;0.02;0.02" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= LCD ================= -->
  <rect x="62" y="62" width="156" height="112" rx="5" fill="#1b1f16"/>
  <rect x="66" y="66" width="148" height="104" rx="3" fill="url(#lcdGlass)" filter="url(#inset)"/>

  <g clip-path="url(#lcdClip)" font-family="'Courier New', Courier, monospace" fill="#232e18">

    <!-- status bar -->
    <g>
      <rect x="72" y="72" width="3" height="5"  opacity="0.85"/>
      <rect x="77" y="69" width="3" height="8"  opacity="0.85"/>
      <rect x="82" y="66.5" width="3" height="10.5" opacity="0.5"/>
      <!-- battery, charging -->
      <rect x="184" y="68" width="22" height="9" rx="1.5" fill="none" stroke="#232e18" stroke-width="1.2"/>
      <rect x="206.5" y="70.5" width="2" height="4" fill="#232e18"/>
      <rect x="186" y="70" width="4" height="5">
        <animate attributeName="width" values="2;18;2" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- boot log, one line at a time -->
    <g font-size="10.5">
      <text x="72" y="98">ALBERTO_OS  v5.0
        <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.06;0.3;0.6;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="72" y="114">&gt; bootloader OK
        <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.16;0.22;0.6;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="72" y="130">&gt; flashing python
        <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.32;0.38;0.6;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="72" y="146">&gt; second life OK
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- progress bar -->
    <rect x="72" y="156" width="136" height="7" fill="none" stroke="#232e18" stroke-width="1.1" opacity="0.7"/>
    <rect x="73.5" y="157.5" width="0" height="4" fill="#232e18" opacity="0.85">
      <animate attributeName="width" values="0;0;133;133;0" keyTimes="0;0.06;0.56;0.93;1" dur="12s" repeatCount="indefinite"/>
    </rect>

    <!-- LCD glass reflection -->
    <path d="M66 66 H214 V96 Q140 118 66 100 Z" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- ================= KEYPAD ================= -->
  <g>
    <g fill="url(#key)" stroke="#0e1114" stroke-opacity="0.7">
      <rect x="64" y="186" width="48" height="21" rx="7"/>
      <rect x="116" y="186" width="48" height="21" rx="7"/>
      <rect x="168" y="186" width="48" height="21" rx="7"/>
      <rect x="64" y="212" width="48" height="21" rx="7"/>
      <rect x="116" y="212" width="48" height="21" rx="7"/>
      <rect x="168" y="212" width="48" height="21" rx="7"/>
      <rect x="64" y="238" width="48" height="21" rx="7"/>
      <rect x="116" y="238" width="48" height="21" rx="7"/>
      <rect x="168" y="238" width="48" height="21" rx="7"/>
    </g>
    <!-- top highlight on each key -->
    <g fill="#ffffff" opacity="0.12">
      <rect x="67" y="188" width="42" height="5" rx="2.5"/>
      <rect x="119" y="188" width="42" height="5" rx="2.5"/>
      <rect x="171" y="188" width="42" height="5" rx="2.5"/>
      <rect x="67" y="214" width="42" height="5" rx="2.5"/>
      <rect x="119" y="214" width="42" height="5" rx="2.5"/>
      <rect x="171" y="214" width="42" height="5" rx="2.5"/>
      <rect x="67" y="240" width="42" height="5" rx="2.5"/>
      <rect x="119" y="240" width="42" height="5" rx="2.5"/>
      <rect x="171" y="240" width="42" height="5" rx="2.5"/>
    </g>
    <!-- a key lights up now and then, like something is being pressed -->
    <rect x="116" y="212" width="48" height="21" rx="7" fill="#a4c463" opacity="0">
      <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.44;0.47;0.52;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ================= NAME ================= -->
  <g font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-weight="bold"
     font-size="54" letter-spacing="9">
    <text x="301" y="121" fill="#05070a" fill-opacity="0.85">ALBERTO</text>
    <text x="299" y="119" fill="#dfe7ef">ALBERTO</text>
  </g>

  <g font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="3.2">
    <text x="303" y="152" fill="#8fa3b8">PYTHON &#183; ROOTING &#183; OLD HARDWARE, NEW BOOT</text>
  </g>

  <!-- ================= TERMINAL STRIP ================= -->
  <rect x="296" y="176" width="380" height="52" rx="7" fill="#0b0e12" filter="url(#inset)"/>
  <rect x="297.5" y="177.5" width="377" height="49" rx="6" fill="none" stroke="#6f7d8c" stroke-opacity="0.3"/>

  <g clip-path="url(#typeClip)" filter="url(#glowSoft)">
    <text x="316" y="209" font-family="'Courier New', Courier, monospace" font-size="16"
          fill="#a4c463">$ fastboot flashing unlock</text>
  </g>
  <rect x="302" y="194" width="9" height="18" fill="#c2dd82" filter="url(#glowSoft)">
    <animate attributeName="x" values="302;600;600;302" keyTimes="0;0.5;0.93;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ================= WII ================= -->
  <g filter="url(#drop)">
    <rect x="800" y="52" width="146" height="200" rx="11" fill="url(#wiiShell)"/>
    <rect x="800" y="52" width="146" height="200" rx="11" fill="none" stroke="#8e99a3" stroke-opacity="0.7"/>
    <rect x="804" y="56" width="138" height="192" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.8"/>
  </g>

  <!-- disc slot + the glow everyone remembers -->
  <rect x="820" y="118" width="106" height="24" rx="4" fill="#4fc3f7" opacity="0.55" filter="url(#glowBlue)">
    <animate attributeName="opacity" values="0.18;0.7;0.18" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="822" y="126" width="102" height="9" rx="4.5" fill="#14181c"/>
  <rect x="824" y="128" width="98" height="5" rx="2.5" fill="url(#slotGlow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- power / eject buttons -->
  <circle cx="838" cy="176" r="9" fill="#dbe3e9" stroke="#93a0aa"/>
  <circle cx="838" cy="176" r="4" fill="#7fdcff" opacity="0.9">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <rect x="856" y="171" width="24" height="10" rx="3" fill="#dbe3e9" stroke="#93a0aa"/>

  <text x="873" y="230" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="10" letter-spacing="3" fill="#8b98a3">HOMEBREW</text>

  <!-- ================= BOTTOM STRIP ================= -->
  <g font-family="'Courier New', Courier, monospace" font-size="11.5" letter-spacing="3.6" fill="#71808f">
    <text x="300" y="272">FLORENCE, IT &#160;|&#160; PYTHON &#160;|&#160; ANDROID &#160;|&#160; RETRO CONSOLES</text>
  </g>

  <!-- ================= LIGHT SWEEP ================= -->
  <g clip-path="url(#matClip)">
    <rect x="-400" y="6" width="260" height="288" fill="url(#sweep)" transform="skewX(-16)">
      <animate attributeName="x" values="-400;1200;1200" keyTimes="0;0.4;1" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
